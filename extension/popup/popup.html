<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>SDR HDR</title>
    <style>
      :root {
        color-scheme: light dark;
        --warn: #b3261e;
        --dim: #6e6e73;
        --ok: #1e7e34;
        --err: #b45309;
        --diag: #7b3fb5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --warn: #ff8a80;
          --dim: #a1a1a6;
          --ok: #6fcf8a;
          --err: #ffb74d;
          --diag: #c9a4f2;
        }
      }
      [hidden] {
        display: none !important;
      }
      body {
        font:
          13px -apple-system,
          sans-serif;
        width: 320px;
        margin: 8px;
        background: Canvas;
        color: CanvasText;
      }
      header {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      header h1 {
        font-size: 14px;
        margin: 0;
      }
      .ver,
      .dim {
        color: var(--dim);
      }
      .switch {
        margin: 0 0 0 auto;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      label {
        display: block;
        margin: 6px 0;
      }
      label:has(:disabled) {
        opacity: 0.45;
      }
      label.slider {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 8px;
      }
      label.slider input[type='range'] {
        grid-column: 1 / -1;
        width: 100%;
        margin: 0;
      }
      .val {
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      body.off #controls {
        opacity: 0.5;
      }
      .note {
        margin: 4px 0;
        color: var(--dim);
      }
      .error {
        margin: 4px 0;
        color: var(--warn);
      }
      #status {
        margin: 6px 0;
        padding: 4px 0 4px 8px;
        border-left: 3px solid var(--dim);
      }
      #status-text {
        font-size: 15px;
        font-weight: 600;
      }
      #status-hint {
        color: var(--dim);
      }
      #status.status-ok {
        border-left-color: var(--ok);
      }
      #status.status-ok #status-text {
        color: var(--ok);
      }
      #status.status-error {
        border-left-color: var(--err);
      }
      #status.status-error #status-text {
        color: var(--err);
      }
      #status.status-diag {
        border-left-color: var(--diag);
      }
      #status.status-diag #status-text {
        color: var(--diag);
      }
      #status.status-wait #status-text,
      #status.status-skip #status-text,
      #status.status-off #status-text,
      #status.status-none #status-text {
        color: var(--dim);
      }
      #my-presets .row {
        display: flex;
        gap: 6px;
        margin: 4px 0;
      }
      #my-presets select,
      #my-presets input[type='text'] {
        flex: 1;
        min-width: 0;
      }
      #up-status {
        min-height: 1.3em;
      }
      #peak-warn {
        min-height: 2.6em;
        margin: 2px 0 6px;
      }
      #peak-warn.warn {
        color: var(--warn);
      }
      #diag-source.stale {
        opacity: 0.5;
      }
      textarea {
        width: 100%;
        height: 160px;
        box-sizing: border-box;
        font:
          11px ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>SDR HDR</h1>
      <span class="ver" id="version">v1.3.0</span>
      <label class="switch"
        ><span id="enabled-state">켜짐</span>
        <input type="checkbox" id="enabled" switch checked aria-label="HDR 변환" />
      </label>
    </header>
    <div id="status" class="status-wait" role="status" title="현재 탭 기준 상태">
      <div id="status-text">확인 중…</div>
      <div id="status-hint"></div>
    </div>
    <div id="init-error" class="error" role="alert" hidden></div>
    <div id="save-status" class="error" role="status"></div>
    <div id="off-note" class="note" hidden>꺼짐: 값은 저장되며 모든 YouTube 탭에서 원본 표시</div>
    <div id="locked-note" class="note" hidden>
      진단 모드라 화질 조정이 잠겨 있습니다. 아래 진단에서 되돌리세요
    </div>
    <div id="controls">
      <label
        >프리셋
        <select id="preset">
          <option value="accurate">정확</option>
          <option value="balanced">균형</option>
          <option value="vivid">강조 (화면 밝기 중간 이하 권장)</option>
          <option value="custom" selected>사용자 지정</option>
        </select>
      </label>
      <div id="backup-note" class="note" hidden>
        <span id="backup-text"></span>
        <button id="backup-undo" type="button">되돌리기</button>
      </div>
      <details id="my-presets">
        <summary id="up-summary">내 프리셋 (0)</summary>
        <div class="row">
          <select id="up-list" aria-label="내 프리셋 목록">
            <option value="" disabled selected>저장된 프리셋 없음</option>
          </select>
          <button id="up-load" type="button">불러오기</button>
          <button id="up-delete" type="button">삭제</button>
        </div>
        <div class="row">
          <input
            id="up-name"
            type="text"
            maxlength="20"
            placeholder="이름"
            aria-label="프리셋 이름"
          />
          <button id="up-save" type="button">현재 설정 저장</button>
        </div>
        <div id="up-status" class="note" role="status"></div>
      </details>
      <label class="slider"
        ><span>HDR 강도</span
        ><span class="val"
          ><span id="strength-value">43%</span> <span id="strength-def" class="dim"></span
        ></span>
        <input type="range" id="strength" min="0" max="100" step="1" value="43" />
      </label>
      <div id="peak-value">유효 피크 ×1.90 (SDR 흰색 대비)</div>
      <div id="peak-warn" role="status"></div>
      <label class="slider"
        ><span>선명도</span
        ><span class="val"
          ><span id="sharpness-value">0%</span> <span id="sharpness-def" class="dim"></span
        ></span>
        <input type="range" id="sharpness" min="0" max="100" step="1" value="0" />
      </label>
      <label class="slider"
        ><span>채도</span
        ><span class="val"
          ><span id="saturation-value">105%</span> <span id="saturation-def" class="dim"></span
        ></span>
        <input type="range" id="saturation" min="50" max="150" step="1" value="105" />
      </label>
      <details id="detail">
        <summary>상세 설정</summary>
        <label class="slider"
          ><span>하이라이트 밝기(P)</span
          ><span class="val"
            ><span id="d-P-value"></span> <span id="d-P-def" class="dim"></span
          ></span>
          <input type="range" id="d-P" min="0" max="1" step="0.01" value="0" />
        </label>
        <label class="slider"
          ><span>확장 시작(k)</span
          ><span class="val"
            ><span id="d-k-value"></span> <span id="d-k-def" class="dim"></span
          ></span>
          <input type="range" id="d-k" min="0" max="1" step="0.01" value="0" />
        </label>
        <label class="slider"
          ><span>곡선 지수(n)</span
          ><span class="val"
            ><span id="d-n-value"></span> <span id="d-n-def" class="dim"></span
          ></span>
          <input type="range" id="d-n" min="0" max="1" step="0.01" value="0" />
        </label>
        <label class="slider"
          ><span>전체 밝기(g)</span
          ><span class="val"
            ><span id="d-g-value"></span> <span id="d-g-def" class="dim"></span
          ></span>
          <input type="range" id="d-g" min="0" max="1" step="0.01" value="0" />
        </label>
        <label class="slider"
          ><span>곡선 채도(s)</span
          ><span class="val"
            ><span id="d-s-value"></span> <span id="d-s-def" class="dim"></span
          ></span>
          <input type="range" id="d-s" min="0" max="1" step="0.01" value="0" />
        </label>
        <label class="slider"
          ><span>하이라이트 채도(hs)</span
          ><span class="val"
            ><span id="d-hs-value"></span> <span id="d-hs-def" class="dim"></span
          ></span>
          <input type="range" id="d-hs" min="0" max="1" step="0.01" value="0" />
        </label>
      </details>
      <label><input type="checkbox" id="hud" /> 페이지 HUD 표시</label>
      <label><input type="checkbox" id="notify" checked /> 상태 알림</label>
      <div id="shortcut-note" class="note">
        Option+H 누르는 동안 원본 · Option+Shift+H 켜기/끄기
      </div>
      <button id="reset" type="button">기본값으로 되돌리기</button>
    </div>
    <details id="diag-section">
      <summary>진단</summary>
      <div id="diag-banner" class="note" hidden>
        <span>진단 모드 사용 중: HDR 효과 꺼짐</span>
        <button id="normal-mode" type="button">정상 모드로</button>
      </div>
      <label
        >모드
        <select id="mode">
          <option value="itm">itm (정상)</option>
          <option value="identity">identity (변환 없이 출력)</option>
          <option value="stripes">stripes (밝기 단계 줄무늬)</option>
          <option value="baseline">baseline (렌더 없음, 비교 기준)</option>
        </select>
      </label>
      <p class="note">보이는 YouTube 탭에서만 갱신됩니다</p>
      <div id="diag-source" class="note"></div>
      <div id="restored-note" class="note" hidden></div>
      <label
        >진단 JSON
        <textarea id="diag" readonly></textarea>
      </label>
      <button id="diag-refresh" type="button" hidden>새 진단 있음 — 갱신</button>
      <button id="copy" type="button">복사</button>
      <span id="copy-status" role="status"></span>
      <a id="save" download="sdrhdr-diag.json">JSON 저장</a>
    </details>
    <script src="../content/ns.js"></script>
    <script src="../content/params.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
