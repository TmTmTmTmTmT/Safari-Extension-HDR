<!doctype html>
<!-- 극장 모드. 조상에 ytd-watch-flexy가 없어 극장 속성은 이 픽스처로 확인할 수 없다 [미확인]. 실제 YouTube DOM 스냅샷(scripts/dom-skeleton.js, 텍스트·URL 제거)에서 조상·#movie_player·video 컨테이너·오른쪽 컨트롤·설정 메뉴만 잘랐다. -->
<html>
  <body>
    <div id="player-container" class="style-scope ytd-watch-flexy">
      <ytd-player id="ytd-player" class="style-scope ytd-watch-flexy">
        <div id="container" class="style-scope ytd-player">
      <div id="movie_player" class="html5-video-player ytp-transparent ytp-exp-bottom-control-flexbox ytp-modern-caption ytp-exp-ppp-update ytp-livebadge-color ytp-grid-scrollable ytp-delhi-modern ytp-delhi-modern-icons ytp-delhi-horizontal-volume-controls ytp-cards-teaser-dismissible ytp-disable-bottom-gradient ytp-delhi-modern-compact-controls ytp-fine-scrubbing-exp ytp-autonav-endscreen-cancelled-state ytp-rounded-miniplayer-not-regular-wide-video playing-mode ytp-hide-fullscreen-title ytp-fullscreen-metadata-top ytp-progress-bar-snap ytp-large-width-mode ytp-hide-info-bar ytp-autohide" data-version>
        <div class="html5-video-container" data-layer>
          <video class="video-stream html5-main-video"></video>
        </div>
        <div id="ytp-id-5" class="ytp-popup ytp-settings-menu" data-layer>
          <div class="ytp-focus-trap-before"></div>
          <div class="ytp-popup-content">
            <div class="ytp-panel">
              <div class="ytp-panel-menu">
              </div>
            </div>
          </div>
          <div class="ytp-focus-trap-after"></div>
        </div>
        <div class="ytp-chrome-bottom" data-layer>
          <div class="ytp-chrome-controls">
            <div class="ytp-right-controls">
              <div class="ytp-right-controls-left">
                <button class="ytp-expand-right-bottom-section-button ytp-button" data-priority data-title-no-tooltip data-tooltip-title></button>
                <button class="ytp-button ytp-autonav-toggle delhi-fast-follow-autonav-toggle" data-priority data-tooltip-target-id data-tooltip-title>
                  <div class="ytp-autonav-toggle-button-container"><div class="ytp-autonav-toggle-button"></div></div>
                </button>
                <button class="ytp-subtitles-button ytp-button" data-priority data-tooltip-title data-title-no-tooltip>
                  <div class="ytp-subtitles-button-icon"></div>
                </button>
                <button class="ytp-button ytp-settings-button ytp-4k-quality-badge" data-tooltip-target-id data-tooltip-title></button>
              </div>
              <div class="ytp-right-controls-right">
                <button class="ytp-size-button ytp-button" data-priority data-title-no-tooltip data-tooltip-title></button>
                <button class="ytp-remote-button ytp-button" data-tooltip-title data-priority></button>
                <button class="ytp-airplay-button ytp-button" data-priority data-tooltip-title></button>
                <button class="ytp-fullscreen-button ytp-button" data-priority data-title-no-tooltip data-tooltip-title></button>
              </div>
              <button class="ytp-pip-button ytp-button" data-priority data-tooltip-target-id data-tooltip-title data-title-no-tooltip></button>
            </div>
          </div>
        </div>
      </div>
        </div>
      </ytd-player>
    </div>
  </body>
</html>
