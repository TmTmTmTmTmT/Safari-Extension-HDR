name: ci
on:
  push:
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: pip install pytest numpy
      - run: npm run lint
      - run: npm test
      - run: pytest sim

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Xcode build (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          proj="$(find xcode -maxdepth 3 -name '*.xcodeproj' -type d 2>/dev/null | head -n 1 || true)"
          if [ -z "$proj" ]; then
            echo "Xcode 프로젝트 없음(M2 사용자 단계 대기)"
            exit 0
          fi
          xcodebuild -version
          pbx="$proj/project.pbxproj"
          if [ ! -f "$pbx" ]; then
            echo "pbxproj 없음: $pbx"
            ls -la "$proj"
            exit 1
          fi
          rc=0
          grep -F -e "$PWD" -e "/Users/" "$pbx" || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "A16 실패: pbxproj에 절대경로가 있습니다."
            exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "grep 실행 실패(rc=$rc)"
            exit 1
          fi
          xcodebuild -project "$proj" -alltargets -configuration Debug CODE_SIGNING_ALLOWED=NO build
